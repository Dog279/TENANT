name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      # Keyless signing and attestations are recorded in Sigstore's PUBLIC
      # transparency log, with the repository and workflow in the certificate.
      # While the repository is private that would publish its identity, so a
      # private release carries checksums and SBOMs only; both come back on
      # their own once the repository is public (TEN-322).
      - name: Install Cosign
        if: ${{ !github.event.repository.private }}
        uses: sigstore/cosign-installer@v3

      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.event.repository.private && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt
