name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.27']

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Check go.mod is tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The limits are per package, and cmd/tenant is the long one: with the
      # fleet's real-process tests it takes about 9 minutes without the race
      # detector and about 19 with it on four fast cores (the tests run one
      # after another), so more on this runner.
      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race -timeout 60m ./...

      - name: Test
        if: runner.os != 'Linux'
        run: go test -timeout 20m ./...

      - name: Offline smoke eval
        run: go run ./cmd/tenant eval --subset smoke --backend echo --baseline-check baselines/smoke.json --quiet
