name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists a PR's commits through the API

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.27'
          # Scan the newest 1.27 patch, the one release.yml builds with; the
          # runner's cached 1.27.x can lag a security release.
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated docs
        shell: bash
        run: |
          go generate ./...
          changed="$(git status --porcelain -- '*.md')"
          if [ -n "$changed" ]; then
            echo "Generated documentation is out of date:"
            echo "$changed"
            exit 1
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
