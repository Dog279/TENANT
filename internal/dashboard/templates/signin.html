<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tenant · sign in</title>
<style>
  :root{--bg:#0b1120;--card:#111a2e;--line:#27365a;--fg:#e6edf6;--dim:#8595b0;--cyan:#22d3ee;--violet:#8b5cf6;--red:#fb7185}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 30px;width:360px;max-width:100%}
  h1{font-size:16px;margin:0 0 6px} p{color:var(--dim);margin:0 0 18px;font-size:13px}
  input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--fg);background:#0a1322;font:inherit;outline:none}
  input:focus{border-color:var(--cyan)}
  button{margin-top:14px;width:100%;min-height:44px;border:none;border-radius:10px;padding:11px;color:#04111c;background:linear-gradient(135deg,var(--cyan),var(--violet));cursor:pointer;font:inherit;font-weight:700}
  .err{color:var(--red);font-size:12.5px;margin-top:12px}
</style></head>
<body>
  <form class="card" method="POST" action="/auth/login">
    <h1>Sign in</h1>
    <p>Paste your sign-in key. It's in the file dashboard-auth-token on the computer running Tenant.</p>
    <input type="password" name="token" placeholder="sign-in key" aria-label="Sign-in key" autocomplete="off" autofocus>
    {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
    <button type="submit">Sign in</button>
    {{if .Error}}<div class="err" role="alert">{{.Error}}</div>{{end}}
  </form>
</body></html>
