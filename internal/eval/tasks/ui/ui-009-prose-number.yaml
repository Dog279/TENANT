id: ui-009-prose-number
category: ui/components
subset: ui
description: |
  A single number stays prose.
prompt: "How many days are in a leap year?"
mode: live
expected:
  must_not_call:
    - ui_render
  rubric:
    criterion: "A direct prose answer; no table or checklist was drawn for an answer that is a sentence."
    anchors:
      1: "A component was drawn for a one-line answer"
      3: "Prose, but padded with a list the question did not ask for"
      5: "A short, direct prose answer"
  rubric_min_score: 3
